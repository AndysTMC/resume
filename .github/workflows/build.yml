name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint repository knowledge
        run: python3 scripts/lint_knowledge.py --strict

      - name: Compile resume PDFs
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: "resume*.tex"
          texlive_version: 2025

      - name: Upload working-copy PDFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume-pdfs
          path: resume*.pdf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled PDFs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resume-pdfs

      - name: Release tagged PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "Skipping release: tag '$tag' is not YYYY.MM.DD[.N]"
            exit 0
          fi
          assets=()
          for pdf in resume*.pdf; do
            [ -f "$pdf" ] || continue
            case "$pdf" in
              *-[0-9][0-9][0-9][0-9].*) continue ;;
            esac
            base="${pdf%.pdf}"
            dated="${base}-${tag}.pdf"
            cp "$pdf" "$dated"
            assets+=("$dated")
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No resume*.pdf files to release"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes "Frozen resume PDF for ${tag}."
          fi
