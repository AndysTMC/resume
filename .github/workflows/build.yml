name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile resume PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "resume*.tex"

      - name: Upload working-copy PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: resume*.pdf
          if-no-files-found: error

      - name: Release tagged PDFs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "Skipping release: tag '$tag' is not YYYY.MM.DD[.N]"
            exit 0
          fi
          assets=()
          for pdf in resume*.pdf; do
            [ -f "$pdf" ] || continue
            case "$pdf" in
              *-[0-9][0-9][0-9][0-9].*) continue ;;
            esac
            base="${pdf%.pdf}"
            dated="${base}-${tag}.pdf"
            cp "$pdf" "$dated"
            assets+=("$dated")
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No resume*.pdf files to release"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes "Frozen resume PDF for ${tag}."
          fi
